name: Build and Push

on:
  workflow_call:
    inputs:
      submodules:
        type: string
        default: 'false'
      make_target:
        type: string
        required: true
      version_suffix:
        type: string
        default: ''
      named_tag:
        type: string
        required: true
      dry_run:
        description: Build everything but skip the registry push
        type: boolean
        default: false
      assert_clean:
        description: Fail if the build dirtied the worktree, which would bake "-dirty" into the version
        type: boolean
        default: false
      sign:
        description: Have flecs/ci-signer sign the pushed manifest, and wait for the result
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: build
        run: make ${{ inputs.make_target }}

      - name: Assert clean worktree
        if: ${{ inputs.assert_clean }}
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build dirtied the worktree, so the baked version carries '-dirty'"
            git status --porcelain
            exit 1
          fi

      - name: archive raw artifacts
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: build
          path: dist/
          retention-days: 1

  docker:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}

      - name: download raw artifacts
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59 # v3.1.0
        with:
          name: build
          path: dist/

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cr.flecs.tech
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_AUTH }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Determine version
        id: version
        run: echo "value=$(cat package.json | jq -r '.version')${{ inputs.version_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ inputs.dry_run && '(dry-run, no push)' || 'and push' }}
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          VERSION: ${{ steps.version.outputs.value }}
          NAMED_TAG: ${{ inputs.named_tag }}
        with:
          source: .
          files: docker-bake.hcl
          push: ${{ !inputs.dry_run }}

      # Sign by digest so one signature covers every tag on this manifest.
      # A dry-run pushes nothing, so there is no digest to sign.
      - name: Resolve pushed digest
        id: image
        if: ${{ inputs.sign && !inputs.dry_run }}
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -eu
          DIGEST="$(printf '%s' "$METADATA" | jq -er '.webapp["containerimage.digest"]')"
          # Take the repository from the tags bake pushed so it cannot drift from
          # docker-bake.hcl. Strips the trailing ":tag" but keeps a registry port.
          NAME="$(printf '%s' "$METADATA" | jq -er '.webapp["image.name"]' | cut -d, -f1)"
          printf 'ref=%s\n' "${NAME%:*}@${DIGEST}" >>"$GITHUB_OUTPUT"

      # Signing runs in flecs/ci-signer because Forgejo's OIDC subject embeds
      # repository and ref, and Azure federated credentials take no wildcards:
      # signing here would need one credential per tag, capped at 20 per identity.
      - name: Sign pushed image
        if: ${{ inputs.sign && !inputs.dry_run }}
        env:
          REF: ${{ steps.image.outputs.ref }}
          API: ${{ github.server_url }}/api/v1
          SOURCE: ${{ github.repository }}@${{ github.run_id }}
          DISPATCH_TOKEN: ${{ secrets.CI_SIGNER_DISPATCH }}
        run: |
          set -eu
          RESPONSE="${RUNNER_TEMP:-/tmp}/dispatch.json"
          # The dispatch ref is ci-signer's default branch, which the federated
          # credential subject must match exactly.
          BODY="$(jq -nc --arg image "$REF" --arg source "$SOURCE" \
            '{ref: "main", inputs: {image: $image, source: $source}, return_run_info: true}')"

          CODE="$(curl -sS -o "$RESPONSE" -w '%{http_code}' -X POST \
            -H "Authorization: token ${DISPATCH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$BODY" \
            "${API}/repos/flecs/ci-signer/actions/workflows/sign-oci.yaml/dispatches")"
          case "$CODE" in
            2??) ;;
            *)
              echo "::error::Sign dispatch failed with HTTP ${CODE}"
              cat "$RESPONSE"
              exit 1
              ;;
          esac
          RUN_ID="$(jq -er '.id' "$RESPONSE")"
          echo "Dispatched sign run ${RUN_ID} in flecs/ci-signer for ${REF}"

          # Poll so a signing failure fails the release instead of passing
          # silently. Terminal states are success, failure, cancelled, skipped.
          i=0
          while [ "$i" -lt 120 ]; do
            STATUS="$(curl -sf -H "Authorization: token ${DISPATCH_TOKEN}" \
              "${API}/repos/flecs/ci-signer/actions/runs/${RUN_ID}" | jq -r '.status')"
            case "$STATUS" in
              success)
                echo "Signed ${REF}"
                exit 0
                ;;
              failure | cancelled | skipped)
                echo "::error::Sign run ${RUN_ID} ended as ${STATUS}"
                exit 1
                ;;
            esac
            i=$((i + 1))
            sleep 5
          done
          echo "::error::Sign run ${RUN_ID} did not finish within 10 minutes"
          exit 1
