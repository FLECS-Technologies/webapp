name: Verify Release

# Hard gate for the release and prerelease workflows: on any failure nothing is
# built and nothing is pushed. A dirty worktree matters because it bakes
# "-dirty" into VITE_APP_VERSION, see resolveAppVersion() in vite.config.ts.
# The tag and the pre-release flag are read from the run context rather than
# passed in, because a caller's with: clause is evaluated while the workflow is
# expanded, before the event payload is available.
on:
  workflow_call:
    outputs:
      version:
        description: Base version from package.json, e.g. "5.3.0"
        value: ${{ jobs.verify.outputs.version }}
      version_suffix:
        description: Image tag suffix, "" for releases and "-rc[.n]" for pre-releases
        value: ${{ jobs.verify.outputs.version_suffix }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.verify.outputs.version }}
      version_suffix: ${{ steps.verify.outputs.version_suffix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Assert clean worktree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Worktree is not clean at ${TAG}"
            git status --porcelain
            exit 1
          fi
          echo "Worktree at ${TAG} is clean"

      - name: Verify tag against package.json
        id: verify
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -eu
          VERSION="$(jq -r '.version' package.json)"
          # Strip an optional leading "v" and compare on the bare version.
          TAG_VERSION="${TAG#v}"

          if [ "${PRERELEASE}" = "true" ]; then
            if ! printf '%s\n' "${TAG_VERSION}" \
              | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc(\.[0-9]+)?$'; then
              echo "::error::Pre-release tag '${TAG}' must be 'v<x>.<y>.<z>-rc' or 'v<x>.<y>.<z>-rc.<n>'"
              exit 1
            fi
            BASE="${TAG_VERSION%%-rc*}"
            SUFFIX="${TAG_VERSION#"${BASE}"}"
          else
            if ! printf '%s\n' "${TAG_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release tag '${TAG}' must be 'v<x>.<y>.<z>' with no suffix; use a pre-release for '-rc' tags"
              exit 1
            fi
            BASE="${TAG_VERSION}"
            SUFFIX=""
          fi

          if [ "${BASE}" != "${VERSION}" ]; then
            echo "::error::Tag '${TAG}' does not match package.json version '${VERSION}'"
            exit 1
          fi

          echo "Tag '${TAG}' matches package.json version '${VERSION}'"
          printf 'version=%s\n' "${VERSION}" >>"$GITHUB_OUTPUT"
          printf 'version_suffix=%s\n' "${SUFFIX}" >>"$GITHUB_OUTPUT"
