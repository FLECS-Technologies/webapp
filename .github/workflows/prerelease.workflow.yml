name: Prerelease

# Pushes real release-build images for a published pre-release, versioned from
# the tag (x.y.z-rc[.n], vx.y.z-rc[.n]) plus the moving "rc" tag, then dry-runs
# the release path so it is proven before the real tag exists.
on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify pre-release
    if: ${{ github.event.release.prerelease }}
    uses: ./.github/workflows/verify-release.yml

  build-and-push:
    name: Build and push rc
    needs: verify
    # Repeated because Forgejo propagates only failure and cancellation through
    # needs: a skipped dependency counts as done, so a job without its own
    # condition would run anyway.
    if: ${{ github.event.release.prerelease }}
    uses: ./.github/workflows/build-and-push.yml
    with:
      make_target: release-build
      version_suffix: ${{ needs.verify.outputs.version_suffix }}
      named_tag: rc
      assert_clean: true
      sign: true
    secrets: inherit

  dry-run-release:
    name: Dry-run the release path
    needs: verify
    if: ${{ github.event.release.prerelease }}
    uses: ./.github/workflows/build-and-push.yml
    with:
      # Builds the exact tags a final release would push, then skips the push.
      # Nothing reaches the registry, so there is nothing to sign.
      make_target: release-build
      named_tag: latest
      dry_run: true
      assert_clean: true
    secrets: inherit
