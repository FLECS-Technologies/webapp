name: Release

# Pushes the release images (x.y.z, vx.y.z, latest) for a published final
# release. Pre-releases are handled entirely by prerelease.workflow.yml, which
# also dry-runs this path so it is proven before the real tag exists.
on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify release
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/verify-release.yml

  build-and-push:
    name: Build and push latest
    needs: verify
    uses: ./.github/workflows/build-and-push.yml
    with:
      # No version_suffix: a final release is tagged x.y.z with nothing appended.
      make_target: release-build
      named_tag: latest
      assert_clean: true
      sign: true
    secrets: inherit
