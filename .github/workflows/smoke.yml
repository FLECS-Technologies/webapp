name: E2E Smoke

on:
  pull_request:
    branches: [main, starship]
  push:
    branches: [main]

jobs:
  smoke:
    name: Playwright smoke and brand rendering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Generate orval types
        run: npm run generate

      - name: Run smoke suite
        run: npm run test:e2e:smoke

      - name: Run cross-browser brand suite
        run: npm run test:e2e:brand

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
