# Local harness for the smoke-prod tier: real nginx, real config, built bundle.
# CI builds the same image but runs it directly, to attach it to the job
# network. See .github/workflows/smoke-prod.yml.
services:
  webapp-prod-test:
    build:
      context: .
      dockerfile: docker/test/Dockerfile
    image: flecs-webapp-prod-test:local
    container_name: flecs-webapp-prod-test
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/health']
      interval: 5s
      timeout: 2s
      retries: 10
